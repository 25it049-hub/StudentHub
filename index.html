<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub | CHARUSAT IT Portal</title>
    <meta name="description" content="Student Hub — events, dashboard, profile and feedback for CHARUSAT IT students, all in one place.">
    <link rel="icon" href="images/studenthublogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;700&family=Galada&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root {
            --text-color: #ffffff;
            --muted-color: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-pink: #fbcfe8;
            --accent-ink: #011d17;
            --font-main: 'Inter', sans-serif;
            --font-heading: 'Galada', cursive;

            /* Dynamic background — tweened by the theme switcher */
            --bg-inner: #0b8a78;
            --bg-mid: #044e3b;
            --bg-outer: #011411;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-inner) 0%, var(--bg-mid) 50%, var(--bg-outer) 100%);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.blue-theme {
            --bg-inner: #0b4f8a;
            --bg-mid: #04294e;
            --bg-outer: #010c14;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        .offscreen-svg {
            position: absolute;
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* ============ BUBBLES ============ */
        #bubbles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            background:
                radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.25) 18%, rgba(255, 255, 255, 0.04) 46%, rgba(255, 255, 255, 0) 62%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0) 58%, rgba(255, 255, 255, 0.22) 82%, rgba(255, 255, 255, 0) 100%);
            box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.35);
        }

        @keyframes floatUpImg {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }

            10% { opacity: 0.4; }
            90% { opacity: 0.4; }

            100% {
                transform: translateY(-110vh) translateX(30px) rotate(360deg);
                opacity: 0;
            }
        }

        /* ============ HEADER ============ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            padding: 2rem 4%;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 120;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1.35rem;
            font-family: var(--font-heading);
            color: var(--text-color);
            text-decoration: none;
            white-space: nowrap;
        }

        .logo-mark {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            padding: 4px;
        }

        .nav {
            display: flex;
            gap: 0.15rem;
            padding: 0.4rem;
            border-radius: 100px;
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .nav-item {
            font-family: 'Manrope', sans-serif;
            color: var(--muted-color);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 0.5rem 0.85rem;
            border-radius: 100px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .nav-item:hover,
        .nav-item:focus-visible,
        .nav-item.active {
            background: var(--accent-pink);
            color: var(--accent-ink);
        }

        .contact-btn {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 100px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .contact-btn:hover,
        .contact-btn:focus-visible {
            background: rgba(0, 0, 0, 0.7);
            transform: translateY(-2px);
        }

        /* ============ HERO ============ */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4%;
            padding-top: 5rem;
        }

        .hero-content {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .main-title,
        .side-title {
            font-family: var(--font-heading);
            font-size: clamp(4rem, 9vw, 11rem);
            line-height: 0.8;
            font-weight: 400;
            white-space: nowrap;
            color: white;
        }

        .outline {
            color: var(--text-color);
            opacity: 0.55;
        }

        /* ============ FAR-BACKGROUND SPARKS ============ */
        .sparks-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            transition: transform 0.1s ease-out;
        }

        .spark {
            position: absolute;
            width: 60px;
            height: 60px;
            pointer-events: none;
            z-index: -1;
            border-radius: 26%;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: linear-gradient(140deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .s1 { top: 10%; left: 15%; }
        .s2 { top: 40%; left: 80%; width: 140px; height: 140px; opacity: 0.4; }
        .s3 { top: 70%; left: 75%; width: 80px; height: 80px; }
        .s4 { top: 85%; left: 20%; width: 120px; height: 120px; opacity: 0.3; }

        /* ============ LEFT COLUMN ============ */
        .hero-left {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 6rem 0;
            gap: 2rem;
            z-index: 100;
        }

        .description {
            color: var(--muted-color);
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 400px;
        }

        .primary-btn {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 0.4rem 0.4rem 0.4rem 1.5rem;
            border-radius: 100px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            width: fit-content;
            transition: all 0.3s ease;
        }

        .primary-btn:hover,
        .primary-btn:focus-visible {
            background: rgba(0, 0, 0, 0.7);
            transform: translateY(-3px);
        }

        .plus-icon {
            background: var(--accent-pink);
            color: var(--accent-ink);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.4rem;
            font-weight: 900;
            line-height: 1;
            padding-bottom: 2px;
        }

        .award-badge {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: auto;
        }

        .award-icon {
            width: 48px;
            height: 48px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .award-text { display: flex; flex-direction: column; }
        .award-title { font-size: 0.7rem; letter-spacing: 0.1em; color: var(--muted-color); }
        .award-subtitle { font-size: 0.85rem; font-weight: 600; }

        /* ============ CENTREPIECE ============ */
        .hero-center {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 0.3s forwards, float 6s ease-in-out infinite;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
        }

        @keyframes fadeIn { to { opacity: 1; } }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .main-product-3d {
            width: 80vw;
            height: 80vh;
            outline: none;
            --progress-bar-color: transparent;
            --poster-color: transparent;
            z-index: 1;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(12deg);
            pointer-events: none;
        }

        .main-product-3d[camera-controls] { pointer-events: auto; }

        /* ============ FLOATING ORBS ============ */
        .orbs-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 110;
            transition: transform 0.1s ease-out;
        }

        .orbs-container-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            transition: transform 0.1s ease-out;
        }

        .orb {
            position: absolute;
            width: 120px;
            height: 120px;
            outline: none;
            --progress-bar-color: transparent;
            --poster-color: transparent;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .o1 { top: 25%; left: 30%; width: 190px; height: 190px; }
        .o2 { top: 60%; left: 42%; width: 100px; height: 100px; }
        .o3 { top: 30%; left: 62%; width: 210px; height: 210px; }
        .o4 { top: 15%; left: 48%; width: 130px; height: 130px; }
        .o5 { top: 75%; left: 20%; width: 115px; height: 115px; }
        .o6 { top: 45%; left: 75%; width: 165px; height: 165px; }
        .o7 { top: 15%; left: 40%; width: 80px; height: 80px; opacity: 0.7; }
        .o8 { top: 50%; left: 55%; width: 70px; height: 70px; opacity: 0.6; }
        .o9 { top: 80%; left: 35%; width: 75px; height: 75px; opacity: 0.7; }

        /* ============ RIGHT COLUMN ============ */
        .hero-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            text-align: right;
            height: 100%;
            padding: 6rem 0;
            z-index: 100;
            width: 450px;
            pointer-events: none;
        }

        .theme-picker {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: flex-end;
            pointer-events: auto;
        }

        .picker-cards { display: flex; gap: 1rem; }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            padding-top: 5rem;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            cursor: pointer;
            font-family: inherit;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 135px;
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
        }

        .card:hover,
        .card:focus-visible {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .card.active {
            border-color: var(--accent-pink);
            background: var(--glass-bg);
        }

        .card img {
            width: 130px;
            height: auto;
            margin-top: -7.5rem;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.5));
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
            display: block;
            will-change: transform;
            pointer-events: none;
        }

        .card:hover img,
        .card:focus-visible img {
            transform: translateY(-30px) rotate(-12deg) scale(1.15) !important;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            font-size: 0.7rem;
            width: 100%;
            word-wrap: break-word;
        }

        .card-info span:first-child { font-weight: 600; }
        .card-info span:last-child { color: var(--muted-color); }

        .picker-nav { display: flex; gap: 1rem; }

        .nav-arrow {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .nav-arrow:hover,
        .nav-arrow:focus-visible { background: rgba(255, 255, 255, 0.1); }

        .side-title { align-self: flex-end; text-align: right; }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 1400px) {
            .nav-item { padding: 0.5rem 0.6rem; font-size: 0.72rem; }
        }

        @media (max-width: 1200px) {
            .main-product-3d { width: 100vw; height: 60vh; top: 40%; }
            .header { flex-wrap: wrap; justify-content: center; padding: 1rem 4%; }
            .hero { padding-top: 9rem; }
            .hero-content { flex-direction: column; align-items: center; justify-content: space-between; }
            .hero-left { padding: 0; align-items: center; text-align: center; height: auto; gap: 1.25rem; }
            .description { max-width: 90%; }
            .award-badge { margin-top: 1rem; }
            .main-title, .side-title { font-size: 4rem; }
            .hero-right { align-items: center; text-align: center; width: 100%; height: auto; padding: 0; }
            .side-title { align-self: center; text-align: center; }
            .orb { opacity: 0.5 !important; }
        }

        @media (prefers-reduced-motion: reduce) {
            body { transition: none; }
            .hero-center { animation: fadeIn 0.6s ease-out forwards; }
            .card, .card img, .orb { transition: none !important; }
        }
    </style>
</head>

<body>
    <div id="bubbles-container"></div>

    <header class="header">
        <a class="logo" href="index.html">
            <img class="logo-mark" src="images/studenthublogo.png" alt="">
            <span>Student Hub</span>
        </a>
        <nav class="nav" aria-label="Main">
            <a href="index.html" class="nav-item active">Home</a>
            <a href="pages/about.html" class="nav-item" target="_blank" rel="noopener">About</a>
            <a href="pages/events.html" class="nav-item" target="_blank" rel="noopener">Events</a>
            <a href="pages/dashboard.html" class="nav-item" target="_blank" rel="noopener">Dashboard</a>
            <a href="pages/profile.html" class="nav-item" target="_blank" rel="noopener">Profile</a>
            <a href="pages/faq.html" class="nav-item" target="_blank" rel="noopener">FAQ</a>
            <a href="pages/feedback.html" class="nav-item" target="_blank" rel="noopener">Feedback</a>
            <a href="pages/contact.html" class="nav-item" target="_blank" rel="noopener">Contact</a>
            <a href="pages/login.html" class="nav-item" target="_blank" rel="noopener">Login</a>
            <a href="pages/register.html" class="nav-item" target="_blank" rel="noopener">Register</a>
        </nav>
        <a class="contact-btn" href="pages/contact.html" target="_blank" rel="noopener">Contact Us</a>
    </header>

    <main class="hero">
        <div class="hero-content">

            <div class="sparks-container">
                <div class="spark s1"></div>
                <div class="spark s2"></div>
                <div class="spark s3"></div>
                <div class="spark s4"></div>
            </div>

            <div class="hero-left">
                <h1 class="main-title">
                    <span class="outline">Student</span><br>
                    Hub
                </h1>
                <p class="description">
                    One place for your whole semester. <br>
                    Events, dashboard, profile and feedback — <br>
                    built for CHARUSAT IT.
                </p>
                <div class="cta-group">
                    <a class="primary-btn" href="pages/dashboard.html" target="_blank" rel="noopener">
                        Open Dashboard
                        <span class="plus-icon" aria-hidden="true">+</span>
                    </a>
                </div>
                <div class="award-badge">
                    <div class="award-icon" aria-hidden="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 15L15 18L19 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="award-text">
                        <span class="award-title">FACULTY OF TECHNOLOGY</span>
                        <span class="award-subtitle">INFORMATION TECHNOLOGY 2026</span>
                    </div>
                </div>
            </div>

            <div class="orbs-container-bg">
                <model-viewer class="orb o7" data-model="gem" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="-20deg 110deg 105%"></model-viewer>
                <model-viewer class="orb o8" data-model="gem" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="160deg 45deg 105%"></model-viewer>
                <model-viewer class="orb o9" data-model="gem" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="45deg 20deg 105%"></model-viewer>
            </div>

            <div class="hero-center">
                <model-viewer id="product-model" alt="Rotating 3D graduation cap" camera-controls
                    disable-zoom shadow-intensity="0" environment-image="neutral" exposure="1.45"
                    interaction-prompt="none" camera-orbit="0deg 90deg 380%" field-of-view="30deg"
                    class="main-product-3d">
                </model-viewer>
            </div>

            <div class="orbs-container">
                <model-viewer class="orb o1" data-model="cap" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="45deg 120deg 105%"></model-viewer>
                <model-viewer class="orb o2" data-model="gem" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="-120deg 45deg 105%"></model-viewer>
                <model-viewer class="orb o3" data-model="cap" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="200deg 90deg 105%"></model-viewer>
                <model-viewer class="orb o4" data-model="gem" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="10deg 20deg 105%"></model-viewer>
                <model-viewer class="orb o5" data-model="gem" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="-45deg 160deg 105%"></model-viewer>
                <model-viewer class="orb o6" data-model="cap" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="80deg 75deg 105%"></model-viewer>
            </div>

            <div class="hero-right">
                <div class="theme-picker">
                    <div class="picker-cards">
                        <button class="card active" type="button" data-flavor="classic" aria-pressed="true">
                            <img src="images/studenthublogo.png" alt="">
                            <span class="card-info">
                                <span>Campus Teal</span>
                                <span>Default</span>
                            </span>
                        </button>
                        <button class="card" type="button" data-flavor="blue" aria-pressed="false">
                            <img src="images/studenthub2.png" alt="">
                            <span class="card-info">
                                <span>Night Blue</span>
                                <span>Dark mode</span>
                            </span>
                        </button>
                    </div>
                    <div class="picker-nav">
                        <button class="nav-arrow" type="button" data-step="-1" aria-label="Previous theme">&#8592;</button>
                        <button class="nav-arrow" type="button" data-step="1" aria-label="Next theme">&#8594;</button>
                    </div>
                </div>
                <h2 class="side-title">
                    <span class="outline">Study</span><br>
                    Smarter
                </h2>
            </div>

        </div>
    </main>

    <svg class="offscreen-svg" aria-hidden="true" focusable="false">
        <filter id="frosted">
            <feTurbulence type="fractalNoise" baseFrequency="0.0125" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="80" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <script>
        /* ------------------------------------------------------------------
           Both 3D models are generated offline and embedded here as glTF-binary
           data URIs, so the page needs no model server and works fully offline.

        const MODELS = { cap: MODEL_CAP, gem: MODEL_GEM };

        const THEMES = {
            classic: { inner: '#0b8a78', mid: '#044e3b', outer: '#011411', body: [0.043, 0.831, 0.706, 1] },
            blue: { inner: '#0b4f8a', mid: '#04294e', outer: '#010c14', body: [0.243, 0.616, 1.0, 1] }
        };

        const modelViewer = document.querySelector('#product-model');
        const orbsFG = document.querySelector('.orbs-container');
        const orbsBG = document.querySelector('.orbs-container-bg');
        const sparksBG = document.querySelector('.sparks-container');
        const allOrbs = document.querySelectorAll('.orb');
        const cards = document.querySelectorAll('.card');
        const arrows = document.querySelectorAll('.nav-arrow');

        let isSwitching = false;
        let switchSpin = 0;
        let currentFlavor = 'classic';

        // Hand every viewer its embedded model
        modelViewer.src = MODEL_CAP;
        allOrbs.forEach(orb => { orb.src = MODELS[orb.dataset.model] || MODEL_GEM; });

        // Recolour the "body" material of a loaded viewer (no textures needed)
        function paint(viewer, rgba) {
            const model = viewer.model;
            if (!model) return;
            model.materials.forEach(material => {
                if (material.name !== 'accent' && material.pbrMetallicRoughness) {
                    material.pbrMetallicRoughness.setBaseColorFactor(rgba);
                }
            });
        }

        function selectCard(flavor) {
            cards.forEach(c => {
                const on = c.dataset.flavor === flavor;
                c.classList.toggle('active', on);
                c.setAttribute('aria-pressed', String(on));
            });
        }

        cards.forEach(card => {
            card.addEventListener('click', () => {
                if (isSwitching || card.dataset.flavor === currentFlavor) return;
                selectCard(card.dataset.flavor);
                switchFlavor(card.dataset.flavor);
            });
        });

        arrows.forEach(arrow => {
            arrow.addEventListener('click', () => {
                if (isSwitching) return;
                const next = currentFlavor === 'classic' ? 'blue' : 'classic';
                selectCard(next);
                switchFlavor(next);
            });
        });

        function switchFlavor(flavor) {
            if (isSwitching) return;
            isSwitching = true;
            currentFlavor = flavor;

            const body = document.body;
            const orbs = document.querySelectorAll('.orb');
            const heroCenter = document.querySelector('.hero-center');
            const target = THEMES[flavor];

            // 1. Background morph
            gsap.to(body, {
                '--bg-inner': target.inner,
                '--bg-mid': target.mid,
                '--bg-outer': target.outer,
                duration: 1.5,
                ease: 'power2.inOut'
            });

            // 2. Centrepiece: 360 spin + blur, recolour at the peak, settle to 720
            const spinObj = { val: 0, blur: 0 };
            gsap.to(spinObj, {
                val: 360,
                blur: 15,
                duration: 0.6,
                ease: 'power2.in',
                onUpdate: () => {
                    switchSpin = spinObj.val;
                    modelViewer.style.filter = `blur(${spinObj.blur}px)`;
                },
                onComplete: () => {
                    body.classList.toggle('blue-theme', flavor === 'blue');
                    paint(modelViewer, target.body);

                    gsap.to(spinObj, {
                        val: 720,
                        blur: 0,
                        duration: 1.5,
                        ease: 'back.out(0.7)',
                        onUpdate: () => {
                            switchSpin = spinObj.val;
                            modelViewer.style.filter = `blur(${spinObj.blur}px)`;
                        },
                        onComplete: () => {
                            switchSpin = 0;
                            modelViewer.style.filter = 'none';
                        }
                    });
                }
            });

            // 3. Orbs implode to centre, swap model, explode back out
            let completedOrbs = 0;
            orbs.forEach(orb => {
                const bW = orb.offsetWidth / 2;
                const bH = orb.offsetHeight / 2;
                const centerX = (window.innerWidth / 2 - orb.offsetLeft - bW);
                const centerY = (window.innerHeight / 2 - orb.offsetTop - bH);

                const startAngle = parseFloat(orb.dataset.angle) || 0;
                const currentBaseX = parseFloat(orb.dataset.baseX) || 0;
                const currentBaseY = parseFloat(orb.dataset.baseY) || 0;

                const nextBaseX = (Math.random() - 0.5) * 200;
                const nextBaseY = (Math.random() - 0.5) * 200;

                gsap.set(orb, { rotation: startAngle, x: currentBaseX, y: currentBaseY });

                gsap.timeline()
                    .to(orb, {
                        x: centerX,
                        y: centerY,
                        rotation: startAngle + 45,
                        scale: 0.1,
                        opacity: 0,
                        duration: 0.5,
                        ease: 'power2.in',
                        onComplete: () => {
                            const nextModel = orb.dataset.model === 'cap' ? 'gem' : 'cap';
                            orb.dataset.model = nextModel;
                            orb.src = MODELS[nextModel];
                            paint(orb, target.body);
                            heroCenter.style.zIndex = 50;
                        }
                    })
                    .to(orb, { duration: 0.3 })
                    .to(orb, {
                        onStart: () => { heroCenter.style.zIndex = 1; },
                        x: nextBaseX,
                        y: nextBaseY,
                        rotation: startAngle + 90,
                        scale: 1,
                        opacity: 1,
                        duration: 0.9,
                        ease: 'back.out(1.5)',
                        onComplete: () => {
                            orb.dataset.angle = startAngle + 90;
                            orb.dataset.baseX = nextBaseX;
                            orb.dataset.baseY = nextBaseY;
                            orb.dataset.rx = 0;
                            orb.dataset.ry = 0;
                            completedOrbs++;
                            if (completedOrbs === orbs.length) isSwitching = false;
                        }
                    });
            });
        }

        // Seed per-orb motion state
        allOrbs.forEach(b => {
            b.dataset.rx = 0;
            b.dataset.ry = 0;
            b.dataset.angle = Math.random() * 360;
            b.dataset.baseX = 0;
            b.dataset.baseY = 0;
        });

        // Repaint each orb once its model finishes loading
        allOrbs.forEach(orb => {
            orb.addEventListener('load', () => paint(orb, THEMES[currentFlavor].body));
        });
        modelViewer.addEventListener('load', () => paint(modelViewer, THEMES[currentFlavor].body));

        let mouse = { x: 0, y: 0, px: -9999, py: -9999 };
        let currentMouse = { x: 0, y: 0 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) - 0.5;
            mouse.y = (e.clientY / window.innerHeight) - 0.5;
            mouse.px = e.clientX;
            mouse.py = e.clientY;
        });

        function animate() {
            const time = Date.now() * 0.001;

            currentMouse.x += (mouse.x - currentMouse.x) * 0.05;
            currentMouse.y += (mouse.y - currentMouse.y) * 0.05;

            // Cursor tilt on the centrepiece + any transition spin
            modelViewer.cameraOrbit = `${(currentMouse.x * 40) + switchSpin}deg ${90 + (currentMouse.y * 20)}deg 380%`;

            orbsFG.style.transform = `translate(${currentMouse.x * 60}px, ${currentMouse.y * 60}px)`;
            orbsBG.style.transform = `translate(${currentMouse.x * -30}px, ${currentMouse.y * -30}px)`;
            sparksBG.style.transform = `translate(${currentMouse.x * -15}px, ${currentMouse.y * -15}px)`;

            if (!isSwitching) {
                allOrbs.forEach((orb, i) => {
                    const rect = orb.getBoundingClientRect();
                    const diffX = mouse.px - (rect.left + rect.width / 2);
                    const diffY = mouse.py - (rect.top + rect.height / 2);
                    const distance = Math.sqrt(diffX * diffX + diffY * diffY);

                    let targetRx = 0, targetRy = 0, speedMult = 1;

                    if (distance < 400 && distance > 0) {
                        const force = (400 - distance) / 400;
                        targetRx = (diffX / distance) * force * -80;
                        targetRy = (diffY / distance) * force * -80;
                        speedMult = 1 + force * 5;
                    }

                    let rx = parseFloat(orb.dataset.rx) || 0;
                    let ry = parseFloat(orb.dataset.ry) || 0;
                    let angle = parseFloat(orb.dataset.angle) || 0;
                    const baseX = parseFloat(orb.dataset.baseX) || 0;
                    const baseY = parseFloat(orb.dataset.baseY) || 0;

                    rx += (targetRx - rx) * 0.1;
                    ry += (targetRy - ry) * 0.1;
                    angle += 0.2 * speedMult;

                    orb.dataset.rx = rx;
                    orb.dataset.ry = ry;
                    orb.dataset.angle = angle;

                    const dur = [5, 7, 6, 8, 5.5, 6.5, 9, 11, 10][i % 9];
                    const phase = (time + i * 0.7) * (Math.PI * 2 / dur);
                    const floatY = Math.sin(phase) * 15;
                    const floatAngle = Math.cos(phase) * 6;

                    orb.style.transform = `translate(calc(${rx + baseX}px), calc(${ry + baseY}px + ${floatY}px)) rotate(calc(${angle}deg + ${floatAngle}deg))`;
                });
            }

            document.querySelectorAll('.spark').forEach((spark, i) => {
                const dur = 10 + i * 2;
                const phase = (time + i * 1.2) * (Math.PI * 2 / dur);
                const floatY = Math.sin(phase) * 20;
                const floatX = Math.cos(phase * 0.5) * 15;
                const floatAngle = Math.sin(phase * 0.3) * 15;
                spark.style.transform = `translate(${floatX}px, ${floatY}px) rotate(${floatAngle}deg)`;
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Endless rising bubbles (pure CSS, no image asset)
        const bubblesContainer = document.getElementById('bubbles-container');

        function createBubble() {
            if (!bubblesContainer) return;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            const size = Math.random() * 20 + 10;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = Math.random() * 100 + '%';
            bubble.style.bottom = '-50px';
            bubble.style.opacity = Math.random() * 0.4 + 0.2;

            const duration = Math.random() * 6 + 4;
            bubble.style.animation = `floatUpImg ${duration}s linear forwards`;

            bubblesContainer.appendChild(bubble);
            setTimeout(() => bubble.remove(), duration * 1000);
        }

        setInterval(createBubble, 400);
    </script>
</body>

</html>
